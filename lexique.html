<div class="wrap">
  <header class="masthead">
    <div class="mh-top" id="mh-top">&nbsp;</div>
    <div class="mh-main">
      <h1 class="wordmark" id="wordmark">&nbsp;</h1>
      <div class="seal" id="sceau" aria-hidden="true"></div>
    </div>
    <div class="dateline">
      <span>Lexique</span>

  <nav class="modebar" id="registres" aria-label="Registres"></nav>

  <main>
    <div class="lx-outils">
      <input id="q" type="search" placeholder="Rechercher un nom, un attribut&hellip;" aria-label="Rechercher dans le registre" autocomplete="off">

      <select id="f-valeur" aria-label="Valeur du filtre" hidden></select>
